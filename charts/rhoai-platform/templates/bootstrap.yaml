apiVersion: v1
kind: ServiceAccount
metadata:
  name: rhoai-dependency
  namespace: {{ .Values.operator.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: '-10'
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: rhoai-dependency
  namespace: {{ .Values.operator.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: '-10'
rules:
  - apiGroups: [operators.coreos.com]
    resources: [subscriptions]
    resourceNames: [rhods-operator]
    verbs: [get]
  - apiGroups: [operators.coreos.com]
    resources: [clusterserviceversions]
    resourceNames: [{{ .Values.operator.csv | quote }}]
    verbs: [get]
  - apiGroups: [operators.coreos.com]
    resources: [installplans]
    verbs: [get, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: rhoai-dependency
  namespace: {{ .Values.operator.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: '-10'
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: rhoai-dependency
subjects:
  - kind: ServiceAccount
    name: rhoai-dependency
    namespace: {{ .Values.operator.namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: rhoai-dependency
  annotations:
    argocd.argoproj.io/sync-wave: '-10'
rules:
  - apiGroups: [apiextensions.k8s.io]
    resources: [customresourcedefinitions]
    resourceNames:
      - datascienceclusters.datasciencecluster.opendatahub.io
      - llminferenceservices.serving.kserve.io
      - llminferenceserviceconfigs.serving.kserve.io
    verbs: [get]
  - apiGroups: [datasciencecluster.opendatahub.io]
    resources: [datascienceclusters]
    resourceNames: [default-dsc]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: rhoai-dependency
  annotations:
    argocd.argoproj.io/sync-wave: '-10'
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: rhoai-dependency
subjects:
  - kind: ServiceAccount
    name: rhoai-dependency
    namespace: {{ .Values.operator.namespace }}
{{- range $phase := list "operator" "serving" }}
{{- if or (eq $phase "operator") $.Values.components.enabled }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: rhoai-dependency-{{ $phase }}
  namespace: {{ $.Values.operator.namespace }}
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: HookSucceeded,BeforeHookCreation
    argocd.argoproj.io/sync-wave: {{ if eq $phase "operator" }}'0'{{ else }}'20'{{ end }}
spec:
  backoffLimit: 2
  activeDeadlineSeconds: {{ add $.Values.bootstrap.timeoutSeconds 60 }}
  template:
    spec:
      serviceAccountName: rhoai-dependency
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: wait
          image: {{ $.Values.bootstrap.image | quote }}
          command: [python3, -u, -c]
          args:
            - |
{{ $.Files.Get "files/bootstrap.py" | indent 14 }}
          env:
            - {name: PHASE, value: {{ $phase | quote }}}
            - {name: OPERATOR_NAMESPACE, value: {{ $.Values.operator.namespace | quote }}}
            - {name: EXPECTED_CSV, value: {{ $.Values.operator.csv | quote }}}
            - {name: TIMEOUT_SECONDS, value: {{ $.Values.bootstrap.timeoutSeconds | quote }}}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 10m, memory: 64Mi}
            limits: {cpu: '1', memory: 256Mi}
{{- end }}
{{- end }}
