apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Values.operator.namespace }}
---
apiVersion: operators.coreos.com/v1
kind: OperatorGroup
metadata:
  name: rhoai
  namespace: {{ .Values.operator.namespace }}
spec: {}
---
apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  name: rhods-operator
  namespace: {{ .Values.operator.namespace }}
spec:
  channel: {{ .Values.operator.channel }}
  installPlanApproval: Manual
  name: rhods-operator
  source: {{ .Values.operator.catalog }}
  sourceNamespace: {{ .Values.operator.catalogNamespace }}
  startingCSV: {{ .Values.operator.csv }}
