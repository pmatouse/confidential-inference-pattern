apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.demo.name }}-binding
immutable: true
data:
  binding.json: {{ .Values.bindingJson | quote }}
  binding.py: {{ .Values.bindingCode | quote }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.demo.name }}-binding
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Values.demo.name }}-binding
rules:
  - apiGroups: [""]
    resources: [persistentvolumeclaims]
    resourceNames: [{{ .Values.demo.name }}-model, {{ .Values.demo.name }}-data]
    verbs: [get]
  - apiGroups: [storage.confidentialcontainers.org]
    resources: [confidentialvolumes]
    verbs: [create]
  - apiGroups: [storage.confidentialcontainers.org]
    resources: [confidentialvolumes]
    resourceNames: [{{ .Values.demo.name }}-model, {{ .Values.demo.name }}-data]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Values.demo.name }}-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ .Values.demo.name }}-binding
subjects:
  - kind: ServiceAccount
    name: {{ .Values.demo.name }}-binding
    namespace: {{ .Release.Namespace }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Values.demo.name }}-binding
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 900
  template:
    metadata:
      labels: {coco.io/skip-initdata: "true"}
    spec:
      serviceAccountName: {{ .Values.demo.name }}-binding
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: bind
          image: {{ .Values.images.python | quote }}
          command: [python3, /configuration/binding.py]
          env: [{name: PYTHONDONTWRITEBYTECODE, value: "1"}]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 25m, memory: 32Mi}
            limits: {cpu: 200m, memory: 128Mi}
          volumeMounts: [{name: configuration, mountPath: /configuration, readOnly: true}]
      volumes:
        - name: configuration
          configMap: {name: {{ .Values.demo.name }}-binding}
