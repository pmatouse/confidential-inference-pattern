<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Confidential Qwen demo</title>
<style>body{font:16px system-ui;max-width:780px;margin:40px auto;padding:0 20px;background:#101820;color:#edf1f4}h1{font-size:28px}textarea{width:100%;height:90px;box-sizing:border-box;padding:12px;font:inherit}button{padding:10px 20px;margin:12px 0;cursor:pointer}#log{white-space:pre-wrap;line-height:1.6}.note{color:#aabac7}</style>
<h1>Confidential Qwen demo</h1><p class="note">Qwen through KServe. Encrypted model and data volumes are opened inside the confidential workload. This page does not independently verify attestation.</p><div id="log" aria-live="polite"></div><form id="chat"><label for="prompt">Message</label><textarea id="prompt" required maxlength="8192"></textarea><button id="send">Send</button></form><div id="status" role="status"></div>
<script>const messages=[];document.querySelector('#chat').onsubmit=async e=>{e.preventDefault();const p=document.querySelector('#prompt'),b=document.querySelector('#send'),s=document.querySelector('#status'),l=document.querySelector('#log');if(!p.value.trim())return;messages.push({role:'user',content:p.value});l.textContent+='You: '+p.value+'\n\n';p.value='';b.disabled=true;s.textContent='Generating…';try{const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:messages.slice(-20)})});const data=await r.json();if(!r.ok)throw Error(data.error||'Request failed');const text=data.choices[0].message.content;messages.push({role:'assistant',content:text});l.textContent+='Qwen: '+text+'\n\n';s.textContent='';}catch(err){messages.pop();s.textContent=err.message;}finally{b.disabled=false;p.focus();}};</script></html>
