apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: inferencereleases.inference.confidentialcontainers.org
spec:
  group: inference.confidentialcontainers.org
  scope: Namespaced
  names:
    plural: inferencereleases
    singular: inferencerelease
    kind: InferenceRelease
    shortNames: [ir]
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - {name: Phase, type: string, jsonPath: .status.phase}
        - {name: Stage, type: string, jsonPath: .status.currentStage}
        - {name: Reason, type: string, jsonPath: .status.reason}
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            spec:
              type: object
              required: [siteConfigRef, acceptance]
              x-kubernetes-validations:
                - rule: self == oldSelf
                  message: A release is immutable; use a new installation or explicit migration
              properties:
                siteConfigRef:
                  type: object
                  required: [name, key, sha256]
                  properties:
                    name: {type: string, maxLength: 63, pattern: '^[a-z0-9]([a-z0-9-]*[a-z0-9])?$'}
                    key: {type: string, enum: [values.json]}
                    sha256: {type: string, pattern: '^[a-f0-9]{64}$'}
                acceptance:
                  type: object
                  required: [mode, allowTestVMReplacement]
                  properties:
                    mode: {type: string, enum: [FreshDemo]}
                    allowTestVMReplacement: {type: boolean, enum: [true]}
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
