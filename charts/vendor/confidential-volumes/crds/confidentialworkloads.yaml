apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: confidentialworkloads.storage.confidentialcontainers.org
spec:
  group: storage.confidentialcontainers.org
  scope: Namespaced
  names:
    plural: confidentialworkloads
    singular: confidentialworkload
    kind: ConfidentialWorkload
    shortNames: [cw]
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Reason
          type: string
          jsonPath: .status.reason
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            spec:
              type: object
              required: [template]
              properties:
                adoptExistingUID:
                  type: string
                  pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'
                template:
                  type: object
                  required: [metadata, spec]
                  properties:
                    metadata:
                      type: object
                      required: [name]
                      properties:
                        name:
                          type: string
                          maxLength: 63
                          pattern: '^[a-z0-9]([a-z0-9-]*[a-z0-9])?$'
                        annotations:
                          type: object
                          additionalProperties:
                            type: string
                        labels:
                          type: object
                          additionalProperties:
                            type: string
                    spec:
                      type: object
                      required: [predictor]
                      properties:
                        predictor:
                          type: object
                          x-kubernetes-preserve-unknown-fields: true
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
