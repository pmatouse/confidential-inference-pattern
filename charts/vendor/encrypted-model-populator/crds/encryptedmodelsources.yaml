apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: encryptedmodelsources.storage.confidentialcontainers.org
spec:
  group: storage.confidentialcontainers.org
  scope: Namespaced
  names:
    plural: encryptedmodelsources
    singular: encryptedmodelsource
    kind: EncryptedModelSource
    shortNames: [ems]
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            spec:
              type: object
              required: [format, repository, manifestDigest, diskDigest, diskBytes]
              x-kubernetes-validations:
                - rule: self == oldSelf
                  message: Model releases are immutable; create a new source for a new release
              properties:
                format:
                  type: string
                  enum: [luks-verity-v1]
                repository:
                  type: string
                  maxLength: 192
                  pattern: '^[a-z0-9][a-z0-9-]{0,62}/[a-z0-9][a-z0-9._-]{0,127}$'
                manifestDigest:
                  type: string
                  pattern: '^sha256:[0-9a-f]{64}$'
                  maxLength: 71
                diskDigest:
                  type: string
                  pattern: '^sha256:[0-9a-f]{64}$'
                  maxLength: 71
                diskBytes:
                  type: integer
                  format: int64
                  minimum: 67108864
                  maximum: 68719476736
                  multipleOf: 4096
