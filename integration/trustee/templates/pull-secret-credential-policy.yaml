{{- if and (eq .Values.global.coco.secured true) (ne .Values.global.clusterPlatform "Azure") }}
{{- /* On Azure peer-pods, CDH does not fetch registry credentials from KBS.
       Pull secrets are distributed to workload namespace SAs instead
       (see sandboxed-policies-chart/pull-secret-distribution.yaml). */ -}}
---
apiVersion: policy.open-cluster-management.io/v1
kind: Policy
metadata:
  name: pull-secret-credential-policy
  annotations:
    argocd.argoproj.io/sync-wave: "5"
spec:
  remediationAction: enforce
  disabled: false
  policy-templates:
  - objectDefinition:
      apiVersion: policy.open-cluster-management.io/v1
      kind: ConfigurationPolicy
      metadata:
        name: pull-secret-credential-cp
      spec:
        remediationAction: enforce
        severity: medium
        object-templates-raw: |
          {{`{{- $pullSecret := (lookup "v1" "Secret" "openshift-config" "pull-secret") -}}`}}
          {{`{{- if $pullSecret -}}`}}
          - complianceType: mustonlyhave
            objectDefinition:
              apiVersion: v1
              kind: Secret
              metadata:
                name: credential
                namespace: trustee-operator-system
              type: Opaque
              data:
                regcred: '{{`{{ index $pullSecret.data ".dockerconfigjson" }}`}}'
          {{`{{- end -}}`}}
---
apiVersion: apps.open-cluster-management.io/v1
kind: PlacementRule
metadata:
  name: pull-secret-credential-placement-rule
  annotations:
    argocd.argoproj.io/sync-wave: "5"
spec:
  clusterConditions:
    - status: "True"
      type: ManagedClusterConditionAvailable
  clusterSelector:
    matchExpressions:
      - key: vendor
        operator: In
        values:
          - OpenShift
---
apiVersion: policy.open-cluster-management.io/v1
kind: PlacementBinding
metadata:
  name: pull-secret-credential-placement-binding
  annotations:
    argocd.argoproj.io/sync-wave: "5"
placementRef:
  apiGroup: apps.open-cluster-management.io
  kind: PlacementRule
  name: pull-secret-credential-placement-rule
subjects:
  - apiGroup: policy.open-cluster-management.io
    kind: Policy
    name: pull-secret-credential-policy
{{ end }}
