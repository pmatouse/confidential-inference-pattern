{{- if .Values.kbs.tdx.enabled }}
---
apiVersion: "external-secrets.io/v1"
kind: ExternalSecret
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  name: tdx-collateral-eso
  namespace: trustee-operator-system
spec:
  refreshInterval: 15s
  secretStoreRef:
    name: {{ .Values.secretStore.name }}
    kind: {{ .Values.secretStore.kind }}
  target:
    name: tdx-collateral
    template:
      type: Opaque
  dataFrom:
  - extract:
      key: 'secret/data/hub/tdxCollateral'
{{- end }}
