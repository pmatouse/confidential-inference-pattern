{{- if ne .Values.global.secretStore.backend "none" }}
---
apiVersion: "external-secrets.io/v1"
kind: ExternalSecret
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  name: sealed-secrets-signing-key-eso
  namespace: trustee-operator-system
spec:
  refreshInterval: 15s
  secretStoreRef:
    name: {{ .Values.secretStore.name }}
    kind: {{ .Values.secretStore.kind }}
  target:
    name: signing-key
    template:
      type: Opaque
  dataFrom:
  - extract:
      key: secret/data/hub/sealedSecretsSigningKey
{{- end }}
