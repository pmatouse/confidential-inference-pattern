name: Add-on checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: azure/setup-helm@v4.3.0
        with:
          version: v3.17.3
      - run: python -m pip install -r requirements.txt
      - run: make test lint
      - run: python3 -m unittest discover -s components/confidential-storage-authority
      - run: make render VALUES=overrides/sites/edge-rtx6k.yaml
  guest-library:
    runs-on: ubuntu-latest
    container:
      image: rust@sha256:4ec71e955e6c08aeb238885083222ddff79d82eb87654a96c76e38e94da1a53b
    steps:
      - uses: actions/checkout@v4
      - run: cargo test --locked --manifest-path components/confidential-storage-guest/Cargo.toml
  sidecar-service:
    runs-on: ubuntu-latest
    container:
      image: rust@sha256:4ec71e955e6c08aeb238885083222ddff79d82eb87654a96c76e38e94da1a53b
    steps:
      - uses: actions/checkout@v4
      - name: Stage unchanged protocol definitions
        run: |
          git clone --no-checkout https://github.com/manuelh-dev/guest-components.git /tmp/guest-components
          git -C /tmp/guest-components checkout --detach 0ab1fb1be6e46293f29600085f929ae035ca3739
          /usr/bin/python3 components/confidential-storage-sidecar/stage-service.py --upstream /tmp/guest-components --output /tmp/service-build
      - name: Test stock-CDH adapter and service
        run: |
          cargo test --locked --manifest-path /tmp/service-build/components/confidential-storage-client/Cargo.toml --features private-rcar-aa
          cargo test --locked --manifest-path /tmp/service-build/components/confidential-storage-kbs/Cargo.toml --features private-cdh
          cargo test --locked --manifest-path /tmp/service-build/components/confidential-storage-service/Cargo.toml --features trustee-rcar
          cargo build --locked --release --manifest-path /tmp/service-build/components/confidential-storage-service/Cargo.toml --features trustee-rcar
  populator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.5'
          cache-dependency-path: components/encrypted-model-populator/go.sum
      - name: Test controller, importer and upstream population machinery
        working-directory: components/encrypted-model-populator
        run: |
          go test -race github.com/kubernetes-csi/lib-volume-populator/v3/populator-machinery ./...
          python3 -m unittest -v test_publish.py
