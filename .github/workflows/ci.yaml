name: Add-on checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: azure/setup-helm@v4.3.0
        with:
          version: v3.17.3
      - run: python -m pip install -r requirements.txt
      - run: make test lint
      - run: make render VALUES=overrides/sites/edge-rtx6k.yaml
