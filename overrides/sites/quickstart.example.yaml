# Public inputs only. Credentials are external private files; see docs/demo/stock-bootstrap.md.
installation:
  name: confidential-inference
  namespace: confidential-inference
  clusterIdentity: replace-with-stable-cluster-id
  profile: osc-snp-nvidia-x86_64-v1
base:
  storageClassName: replace-with-block-storage-class
  trusteeName: kbsconfig
registry:
  origin: https://image-registry.openshift-image-registry.svc:5000
  injectServiceCA: true
demo:
  name: qwen-demo-001
  modelKeyResource: kbs:///default/model-keys/qwen-demo-001-model
  dataKeyResource: kbs:///default/model-keys/qwen-demo-001-data
  approvedManifestRef: qwen-demo-001-model
chat:
  enabled: true
  serviceType: ClusterIP
quickstart:
  trustedNamespace: confidential-inference-trusted
  runtimeNode: replace-with-qualified-node
  allowReadOnlyHostArtifacts: true
  allowTrusteeRestart: true
  vault:
    namespace: vault
    pod: vault-0
    enrollmentNamespace: confidential-inference-enrollment
    serviceAccount: confidential-inference-enroller
    authMount: hub
    role: confidential-inference-enroller
    backendPath: secret/data/hub/modelKeys
    externalSecret: model-keys-eso
    projectionSecret: model-keys
  trustee:
    origin: https://kbs.apps.example.internal
    deployment: trustee-deployment
    caSecret: kbs-https-certificate
    signerSecret: attestation-cert
    owner:
      namespace: vp-gitops
      application: trustee
      repository: git@github.com:your-org/your-coco-pattern.git
      branch: main
      valuesFile: overrides/values-confidential-inference.yaml
  dependencies:
    installKServe: true
  integrations:
    enabled: true
    topologyFile: values-baremetal.yaml
    parentApplication: coco-pattern-baremetal
    applicationKey: trustee
